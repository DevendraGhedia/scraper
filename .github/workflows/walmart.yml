name: Walmart - Furniture Product Scraper

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base site URL"
        required: true
        default: "https://www.walmart.com"
      sitemap_path:
        description: "Sitemap file or URL (default: sitemap_hi_ip.xml)"
        required: false
        default: "sitemap_hi_ip.xml"
      total_sitemaps:
        description: "Total sitemaps to process (0 = auto-detect)"
        default: "0"
      sitemaps_per_job:
        description: "Sitemaps per parallel job"
        default: "2"
      urls_per_sitemap:
        description: "Max URLs per sitemap (0 = all)"
        default: "200"
      max_workers:
        description: "Parallel requests per job"
        default: "4"
      request_delay:
        description: "Delay between requests (seconds)"
        default: "1.0"

jobs:
  # ============================================================
  # JOB 1 — PLAN: figure out how many parallel jobs to spawn
  # ============================================================
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      site_name: ${{ steps.get_site_name.outputs.site_name }}
    steps:
      - name: Extract site name from URL
        id: get_site_name
        run: |
          URL="${{ github.event.inputs.url }}"
          SITE_NAME=$(echo "$URL" | sed -E 's|https?://||;s|www\.||;s|\.[a-zA-Z]+(/.*)?$||;s|/.*||')
          echo "site_name=$SITE_NAME" >> $GITHUB_OUTPUT
          echo "Site name: $SITE_NAME"

      - name: Build job matrix
        id: matrix
        env:
          BASE_URL:       ${{ github.event.inputs.url }}
          SITEMAP_PATH:   ${{ github.event.inputs.sitemap_path }}
          TOTAL_SITEMAPS: ${{ github.event.inputs.total_sitemaps }}
          PER_JOB:        ${{ github.event.inputs.sitemaps_per_job }}
          PROXY:          ${{ secrets.PROXY || secrets.HTTPS_PROXY || '' }}
        run: |
          pip install -q curl_cffi
          python3 - << 'EOF'
          import os, json, re, math
          from xml.etree import ElementTree as ET
          from curl_cffi import requests as cc_requests

          base_url     = os.environ.get("BASE_URL", "https://www.walmart.com").rstrip("/")
          sitemap_path = (os.environ.get("SITEMAP_PATH") or "sitemap_hi_ip.xml").strip()
          total_input  = int(os.environ.get("TOTAL_SITEMAPS") or "0")
          per_job      = max(1, int(os.environ.get("PER_JOB") or "2"))
          proxy        = (os.environ.get("PROXY") or "").strip()
          proxies      = {"http": proxy, "https": proxy} if proxy else None

          total = total_input
          if total == 0:
              sitemap_url = sitemap_path if sitemap_path.startswith("http") else f"{base_url}/{sitemap_path.lstrip('/')}"
              try:
                  r = cc_requests.get(sitemap_url, impersonate="chrome124", proxies=proxies, timeout=20)
                  if r.status_code == 200 and "Robot or human?" not in r.text[:4000] and not r.text.lstrip().startswith("<html"):
                      cleaned = re.sub(r'<script[^>]*/>', '', r.text)
                      cleaned = re.sub(r'<script[^>]*>.*?</script>', '', cleaned, flags=re.DOTALL)
                      root = ET.fromstring(cleaned)
                      ns = {"ns": "http://www.sitemaps.org/schemas/sitemap/0.9"}
                      locs = root.findall(".//ns:sitemap/ns:loc", ns) or root.findall(".//sitemap/loc")
                      total = len(locs) if locs else 1
                      print(f"Auto-detected {total} sitemaps from {sitemap_url}")
                  else:
                      print(f"Could not auto-detect sitemaps (status={r.status_code}), falling back to 10")
                      total = 10
              except Exception as e:
                  print(f"Sitemap auto-detect failed ({e}), falling back to 10")
                  total = 10

          jobs = math.ceil(total / per_job)
          matrix = [
              {"offset": i * per_job, "limit": per_job, "url": base_url}
              for i in range(jobs)
          ]
          matrix_json = json.dumps(matrix, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={matrix_json}\n")

          print(f"Total sitemaps : {total}")
          print(f"Sitemaps/job   : {per_job}")
          print(f"Jobs planned   : {jobs}")
          print(f"Matrix         : {matrix_json}")
          EOF

  # ============================================================
  # JOB 2 — SCRAPE: run N parallel jobs, each handling a slice
  # ============================================================
  scrape:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi beautifulsoup4 lxml

      - name: Run Walmart scraper
        env:
          CURR_URL:             ${{ matrix.url }}
          SITEMAP_PATH:         ${{ github.event.inputs.sitemap_path }}
          SITEMAP_OFFSET:       ${{ matrix.offset }}
          MAX_SITEMAPS:         ${{ matrix.limit }}
          MAX_URLS_PER_SITEMAP: ${{ github.event.inputs.urls_per_sitemap }}
          MAX_WORKERS:          ${{ github.event.inputs.max_workers }}
          REQUEST_DELAY:        ${{ github.event.inputs.request_delay }}
          PROXY:                ${{ secrets.PROXY || secrets.HTTPS_PROXY || '' }}
        run: |
          echo "========================================"
          echo " Walmart Scraper — Job Configuration (Furniture Only)"
          echo "========================================"
          echo "CURR_URL             : $CURR_URL"
          echo "SITEMAP_PATH         : $SITEMAP_PATH"
          echo "SITEMAP_OFFSET       : $SITEMAP_OFFSET"
          echo "MAX_SITEMAPS         : $MAX_SITEMAPS"
          echo "MAX_URLS_PER_SITEMAP : $MAX_URLS_PER_SITEMAP"
          echo "MAX_WORKERS          : $MAX_WORKERS"
          echo "REQUEST_DELAY        : $REQUEST_DELAY"
          echo "========================================"

          python walmart/walmart.py

          echo ""
          echo "Generated files:"
          ls -la media/output/scrapping/walmart/walmart_products_chunk_*.csv 2>/dev/null || echo "No CSV files generated"

      - name: Upload chunk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunk_${{ matrix.offset }}
          path: |
            media/output/scrapping/walmart/walmart_products_chunk_*.csv
            url_list_chunk_*.txt
          if-no-files-found: warn

      - name: Upload failure log (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures_${{ matrix.offset }}
          path: media/output/scrapping/failure_csv/Walmart_failures.csv
          if-no-files-found: ignore

  # ============================================================
  # JOB 3 — MERGE: combine all chunk CSVs into one final file
  # ============================================================
  merge:
    needs: [plan, scrape]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        with:
          path: chunks
          pattern: chunk_*
          merge-multiple: true

      - name: Merge CSV chunks
        id: merge_csv
        run: |
          echo "Merging CSV chunks..."

          CSV_FILES=$(find chunks -name "walmart_products_chunk_*.csv" 2>/dev/null)

          if [ -z "$CSV_FILES" ]; then
            echo "ERROR: No CSV files found!"
            ls -la chunks/ 2>/dev/null || echo "chunks/ directory not found"
            exit 1
          fi

          echo "Found files:"
          echo "$CSV_FILES"

          FIRST_FILE=$(echo "$CSV_FILES" | head -n 1)
          head -n 1 "$FIRST_FILE" > walmart_products_full.csv

          TOTAL_ROWS=0
          FILE_COUNT=0
          for f in $CSV_FILES; do
            if [ -f "$f" ]; then
              FILE_COUNT=$((FILE_COUNT + 1))
              ROWS=$(tail -n +2 "$f" | wc -l)
              TOTAL_ROWS=$((TOTAL_ROWS + ROWS))
              echo "  $f — $ROWS rows"
              tail -n +2 "$f" | sed '/^$/d' >> walmart_products_full.csv
            fi
          done

          FINAL_ROWS=$(tail -n +2 walmart_products_full.csv | wc -l)
          echo "Merged: $FINAL_ROWS rows from $FILE_COUNT chunk files"

          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "final_rows=$FINAL_ROWS" >> $GITHUB_OUTPUT

      - name: Merge failure logs
        if: always()
        run: |
          FAIL_FILES=$(find chunks -name "Walmart_failures.csv" 2>/dev/null)
          if [ -z "$FAIL_FILES" ]; then
            echo "No failure logs found."
            exit 0
          fi

          FIRST=$(echo "$FAIL_FILES" | head -n 1)
          head -n 1 "$FIRST" > walmart_failures_full.csv
          for f in $FAIL_FILES; do
            tail -n +2 "$f" | sed '/^$/d' >> walmart_failures_full.csv
          done

          FAIL_COUNT=$(tail -n +2 walmart_failures_full.csv | wc -l)
          echo "Total failed URLs: $FAIL_COUNT"

      - name: Build output filename
        id: meta
        run: |
          SITE_NAME="${{ needs.plan.outputs.site_name }}"
          [ -z "$SITE_NAME" ] && SITE_NAME="walmart"
          DATE=$(date +%F_%H%M%S)
          FILENAME="${SITE_NAME}_${DATE}.csv"
          echo "name=$FILENAME" >> $GITHUB_OUTPUT
          echo "Output filename: $FILENAME"

      - name: Merge per-chunk URL lists
        id: merge_urls
        run: |
          find chunks -name "url_list_chunk_*.txt" 2>/dev/null | sort | xargs cat 2>/dev/null | sort -u > all_sitemap_urls.txt || true
          URL_COUNT=$(wc -l < all_sitemap_urls.txt | tr -d ' ')
          echo "Total unique sitemap URLs: $URL_COUNT"
          echo "url_count=$URL_COUNT" >> $GITHUB_OUTPUT

      - name: Build FTP directory structure
        id: ftp_structure
        run: |
          DATE=$(date +%Y%m%d)
          TIMESTAMP=$(date +%Y%m%d%H%M)
          COMPETITOR="Walmart"

          echo "competitor=$COMPETITOR" >> $GITHUB_OUTPUT
          echo "date_str=$DATE" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          mkdir -p "ftp_output/${COMPETITOR}/${DATE}/input"
          mkdir -p "ftp_output/${COMPETITOR}/${DATE}/output/temp"

          cp all_sitemap_urls.txt "ftp_output/${COMPETITOR}/${DATE}/input/URLList${TIMESTAMP}.csv" 2>/dev/null || true
          cp all_sitemap_urls.txt "ftp_output/${COMPETITOR}/${DATE}/output/temp/URLListForScrap${TIMESTAMP}.csv" 2>/dev/null || true
          cp walmart_products_full.csv "ftp_output/${COMPETITOR}/${DATE}/output/FinalScrappedData${TIMESTAMP}.csv" 2>/dev/null || true

          echo "FTP structure:"
          find ftp_output -type f | sort

      - name: Generate FinalURLListForScrap
        run: |
          COMPETITOR="${{ steps.ftp_structure.outputs.competitor }}"
          DATE="${{ steps.ftp_structure.outputs.date_str }}"
          TIMESTAMP="${{ steps.ftp_structure.outputs.timestamp }}"

          SCRAPED="ftp_output/${COMPETITOR}/${DATE}/output/FinalScrappedData${TIMESTAMP}.csv"
          URLS="ftp_output/${COMPETITOR}/${DATE}/output/temp/URLListForScrap${TIMESTAMP}.csv"
          OUT="ftp_output/${COMPETITOR}/${DATE}/output/FinalURLListForScrap${TIMESTAMP}.csv"

          if [ -f "$URLS" ] && [ -f "$SCRAPED" ]; then
            python3 ftp_manager.py track-urls --sitemap-file "$URLS" --scraped-file "$SCRAPED" --output-file "$OUT"
            echo "Generated FinalURLListForScrap: $OUT"
          fi

      - name: Upload to FTP (structured path)
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "FTP credentials not set — skipping upload."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y lftp
          COMPETITOR="${{ steps.ftp_structure.outputs.competitor }}"
          DATE="${{ steps.ftp_structure.outputs.date_str }}"
          BASE="${FTP_BASE_DIR}/${COMPETITOR}/${DATE}"
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          mirror -R ftp_output/${COMPETITOR}/${DATE} ${BASE}
          bye
          EOF
          echo "FTP upload complete: ${BASE}"
        env:
          FTP_HOST:     ${{ secrets.FTP_HOST }}
          FTP_USER:     ${{ secrets.FTP_USER }}
          FTP_PASS:     ${{ secrets.FTP_PASS }}
          FTP_BASE_DIR: ${{ secrets.FTP_PATH }}

      - name: Print summary
        run: |
          echo "========================================="
          echo "           SCRAPING SUMMARY"
          echo "========================================="
          echo "Site Name    : ${{ needs.plan.outputs.site_name }}"
          echo "Site URL     : ${{ github.event.inputs.url }}"
          echo "Output File  : ${{ steps.meta.outputs.name }}"
          echo "Chunk Files  : ${{ steps.merge_csv.outputs.file_count }}"
          echo "Total Rows   : ${{ steps.merge_csv.outputs.final_rows }}"
          echo "-----------------------------------------"
          echo "Config:"
          echo "  Max Workers    : ${{ github.event.inputs.max_workers }}"
          echo "  Request Delay  : ${{ github.event.inputs.request_delay }}s"
          echo "  URLs/Sitemap   : ${{ github.event.inputs.urls_per_sitemap }}"
          echo "  Sitemaps/Job   : ${{ github.event.inputs.sitemaps_per_job }}"
          echo "  Total Sitemaps : ${{ github.event.inputs.total_sitemaps }}"
          echo "========================================="
          echo ""
          echo "Sample output (first 3 data rows):"
          head -n 4 walmart_products_full.csv 2>/dev/null || echo "No data available"

      - name: Archive final results
        uses: actions/upload-artifact@v4
        with:
          name: final_results
          path: |
            walmart_products_full.csv
            walmart_failures_full.csv
          retention-days: 7
