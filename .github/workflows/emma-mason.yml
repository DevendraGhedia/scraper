name: Emma Mason - Product Scraper

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base site URL"
        required: true
        default: "https://www.emmamason.com"
      sitemap_url:
        description: "Direct Sitemap URL (optional, skips auto-discovery)"
        required: false
        default: ""
      total_sitemaps:
        description: "Total sitemaps to process (0 = auto)"
        default: "0"
      sitemaps_per_job:
        description: "Sitemaps per parallel job"
        default: "2"
      urls_per_sitemap:
        description: "Max URLs per sitemap"
        default: "100"
      max_workers:
        description: "Parallel requests per job"
        default: "4"
      request_delay:
        description: "Delay between requests (seconds)"
        default: "1.0"
      sample_size:
        description: "Number of URLs to sample for product checking"
        default: "5"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      site_name: ${{ steps.get_site_name.outputs.site_name }}
    steps:
      - name: Get site name from URL
        id: get_site_name
        run: |
          URL="${{ github.event.inputs.url }}"
          SITE_NAME=$(echo "$URL" | sed -E 's|https?://||;s|www\.||;s|\.[a-zA-Z]+(/.*)?$||;s|/.*||')
          echo "site_name=$SITE_NAME" >> $GITHUB_OUTPUT
          echo "Site name extracted: $SITE_NAME"
      
      - id: matrix
        run: |
          TOTAL=${{ github.event.inputs.total_sitemaps }}
          PER_JOB=${{ github.event.inputs.sitemaps_per_job }}
          URL="${{ github.event.inputs.url }}"
          
          if [ "$TOTAL" -eq 0 ]; then
            echo "Using default total sitemaps: 10"
            TOTAL=10
          fi
          
          JOBS=$(( (TOTAL + PER_JOB - 1) / PER_JOB ))
          
          MATRIX="["
          for ((i=0;i<JOBS;i++)); do
            OFFSET=$(( i * PER_JOB ))
            MATRIX+="{\"offset\":$OFFSET,\"limit\":$PER_JOB,\"url\":\"$URL\"},"
          done
          MATRIX="${MATRIX%,}]"
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Total sitemaps: $TOTAL"
          echo "Sitemaps per job: $PER_JOB"
          echo "Jobs planned: $JOBS"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    
    # Service container for Cloudflare bypass
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: --cap-add=SYS_ADMIN
    
    steps:
      - uses: actions/checkout@v4

      - name: Wait for FlareSolverr to be ready
        run: |
          echo "Waiting for FlareSolverr service to be ready..."
          sleep 10
          
          for i in {1..30}; do
            if curl -s -f -X POST http://localhost:8191/v1 \
              -H "Content-Type: application/json" \
              -d '{"cmd": "sessions.list"}' > /dev/null 2>&1; then
              echo "✓ FlareSolverr is ready!"
              
              TEST_RESPONSE=$(curl -s -X POST http://localhost:8191/v1 \
                -H "Content-Type: application/json" \
                -d '{"cmd": "sessions.create"}')
              echo "FlareSolverr test response: $TEST_RESPONSE"
              break
            fi
            echo "Attempt $i: FlareSolverr not ready yet..."
            sleep 2
            
            if [ $i -eq 30 ]; then
              echo "❌ FlareSolverr failed to start after 60 seconds"
              docker logs flaresolverr || true
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi cloudscraper lxml

      - name: Run Emma Mason scraper with FlareSolverr
        id: scrape_run
        continue-on-error: true
        env:
          CURR_URL: ${{ matrix.url }}
          SITEMAP_URL: ${{ github.event.inputs.sitemap_url }}
          SITEMAP_OFFSET: ${{ matrix.offset }}
          MAX_SITEMAPS: ${{ matrix.limit }}
          MAX_URLS_PER_SITEMAP: ${{ github.event.inputs.urls_per_sitemap }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers }}
          REQUEST_DELAY: ${{ github.event.inputs.request_delay }}
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size }}
          PROXY: ${{ secrets.PROXY || secrets.HTTPS_PROXY || '' }}
          FLARESOLVERR_URL: http://localhost:8191/v1
          FLARESOLVERR_TIMEOUT: "120"
        run: |
          echo "Starting Emma Mason scraper with FlareSolverr:"
          echo "CURR_URL: $CURR_URL"
          echo "SITEMAP_OFFSET: $SITEMAP_OFFSET"
          echo "MAX_SITEMAPS: $MAX_SITEMAPS"
          echo "MAX_URLS_PER_SITEMAP: $MAX_URLS_PER_SITEMAP"
          echo "MAX_WORKERS: $MAX_WORKERS"
          echo "REQUEST_DELAY: $REQUEST_DELAY"
          echo "SAMPLE_SIZE: $SAMPLE_SIZE"
          echo "FLARESOLVERR_URL: $FLARESOLVERR_URL"
          echo ""
          
          # Add connection test in Python
          python -c "
          import requests
          import sys
          try:
              r = requests.post('http://localhost:8191/v1', 
                              json={'cmd': 'sessions.list'}, 
                              timeout=10)
              print(f'✓ FlareSolverr connection test: {r.status_code}')
              sys.exit(0)
          except Exception as e:
              print(f'✗ FlareSolverr connection failed: {e}')
              sys.exit(1)
          "
          
          python drl/em_scraper.py || echo "Scraper failed with exit code $?"
          
          echo ""
          echo "Generated files:"
          ls -la *.csv 2>/dev/null || echo "No CSV files generated"

      - name: Upload chunk (even on failure)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chunk_${{ matrix.offset }}
          path: |
            products_chunk_*.csv
            url_list_chunk_*.txt
          if-no-files-found: warn

  merge:
    needs: [plan, scrape]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all chunks
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: chunks
          pattern: chunk_*
          merge-multiple: true

      - name: Check for CSV files
        id: check_files
        run: |
          CSV_FILES=$(find chunks -name "products_chunk_*.csv" 2>/dev/null || echo "")
          
          if [ -z "$CSV_FILES" ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "ERROR: No CSV files found in artifacts!"
            exit 0
          else
            echo "has_files=true" >> $GITHUB_OUTPUT
            echo "Found CSV files:"
            echo "$CSV_FILES"
            CHUNK_COUNT=$(echo "$CSV_FILES" | wc -l)
            echo "chunk_count=$CHUNK_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Merge CSV chunks
        id: merge_csv
        if: steps.check_files.outputs.has_files == 'true'
        run: |
          echo "Merging CSV chunks..."
          
          CSV_FILES=$(find chunks -name "products_chunk_*.csv")
          
          FIRST_FILE=$(echo "$CSV_FILES" | head -n 1)
          echo "Using header from: $FIRST_FILE"
          
          head -n 1 "$FIRST_FILE" > products_full.csv
          
          TOTAL_ROWS=0
          FILE_COUNT=0
          for f in $CSV_FILES; do
            if [ -f "$f" ]; then
              FILE_COUNT=$((FILE_COUNT + 1))
              ROWS=$(tail -n +2 "$f" 2>/dev/null | wc -l || echo "0")
              TOTAL_ROWS=$((TOTAL_ROWS + ROWS))
              echo "Processing $f: $ROWS rows"
              tail -n +2 "$f" 2>/dev/null | sed '/^$/d' >> products_full.csv
            fi
          done
          
          FINAL_ROWS=$(tail -n +2 products_full.csv 2>/dev/null | wc -l || echo "0")
          echo "Merged $FINAL_ROWS rows from $FILE_COUNT files"
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "final_rows=$FINAL_ROWS" >> $GITHUB_OUTPUT

      - name: Build output filename
        id: meta
        run: |
          SITE_NAME="${{ needs.plan.outputs.site_name }}"
          if [ -z "$SITE_NAME" ]; then
            SITE_NAME="emma_mason"
          fi
          DATE=$(date +%F_%H%M%S)
          echo "name=${SITE_NAME}_${DATE}.csv" >> $GITHUB_OUTPUT
          echo "Generated filename: ${SITE_NAME}_${DATE}.csv"
          cp products_full.csv "${SITE_NAME}_${DATE}.csv" 2>/dev/null || true

      - name: Merge per-chunk URL lists
        id: merge_urls
        run: |
          find chunks -name "url_list_chunk_*.txt" 2>/dev/null | sort | xargs cat 2>/dev/null | sort -u > all_sitemap_urls.txt || true
          URL_COUNT=$(wc -l < all_sitemap_urls.txt | tr -d ' ')
          echo "Total unique sitemap URLs: $URL_COUNT"
          echo "url_count=$URL_COUNT" >> $GITHUB_OUTPUT

      - name: Build FTP directory structure
        id: ftp_structure
        run: |
          DATE=$(date +%Y%m%d)
          TIMESTAMP=$(date +%Y%m%d%H%M)
          COMPETITOR="Emmamason"

          echo "competitor=$COMPETITOR" >> $GITHUB_OUTPUT
          echo "date_str=$DATE" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          mkdir -p "ftp_output/${COMPETITOR}/${DATE}/input"
          mkdir -p "ftp_output/${COMPETITOR}/${DATE}/output/temp"

          cp all_sitemap_urls.txt "ftp_output/${COMPETITOR}/${DATE}/input/URLList${TIMESTAMP}.csv" 2>/dev/null || true
          cp all_sitemap_urls.txt "ftp_output/${COMPETITOR}/${DATE}/output/temp/URLListForScrap${TIMESTAMP}.csv" 2>/dev/null || true
          cp products_full.csv "ftp_output/${COMPETITOR}/${DATE}/output/FinalScrappedData${TIMESTAMP}.csv" 2>/dev/null || cp "${{ steps.meta.outputs.name }}" "ftp_output/${COMPETITOR}/${DATE}/output/FinalScrappedData${TIMESTAMP}.csv" 2>/dev/null || true

          echo "FTP structure:"
          find ftp_output -type f | sort

      - name: Generate FinalURLListForScrap
        run: |
          COMPETITOR="${{ steps.ftp_structure.outputs.competitor }}"
          DATE="${{ steps.ftp_structure.outputs.date_str }}"
          TIMESTAMP="${{ steps.ftp_structure.outputs.timestamp }}"

          SCRAPED="ftp_output/${COMPETITOR}/${DATE}/output/FinalScrappedData${TIMESTAMP}.csv"
          URLS="ftp_output/${COMPETITOR}/${DATE}/output/temp/URLListForScrap${TIMESTAMP}.csv"
          OUT="ftp_output/${COMPETITOR}/${DATE}/output/FinalURLListForScrap${TIMESTAMP}.csv"

          if [ -f "$URLS" ] && [ -f "$SCRAPED" ]; then
            python3 ftp_manager.py track-urls --sitemap-file "$URLS" --scraped-file "$SCRAPED" --output-file "$OUT"
            echo "Generated FinalURLListForScrap: $OUT"
          fi

      - name: Upload to FTP (structured path)
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "FTP credentials not set — skipping upload."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y lftp
          COMPETITOR="${{ steps.ftp_structure.outputs.competitor }}"
          DATE="${{ steps.ftp_structure.outputs.date_str }}"
          BASE="${FTP_BASE_DIR}/${COMPETITOR}/${DATE}"
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          mirror -R ftp_output/${COMPETITOR}/${DATE} ${BASE}
          bye
          EOF
          echo "FTP upload complete: ${BASE}"
        env:
          FTP_HOST:     ${{ secrets.FTP_HOST }}
          FTP_USER:     ${{ secrets.FTP_USER }}
          FTP_PASS:     ${{ secrets.FTP_PASS }}
          FTP_BASE_DIR: ${{ secrets.FTP_PATH }}

      - name: Create summary report
        run: |
          SITE_NAME="${{ needs.plan.outputs.site_name }}"
          SITE_URL="${{ github.event.inputs.url }}"
          OUTPUT_FILE="${{ steps.meta.outputs.name }}"
          FILE_COUNT="${{ steps.merge_csv.outputs.file_count || '0' }}"
          TOTAL_ROWS="${{ steps.merge_csv.outputs.final_rows || '0' }}"
          SUCCESSFUL_CHUNKS="${{ steps.check_files.outputs.chunk_count || '0' }}"
          PLANNED_JOBS="${{ fromJson(needs.plan.outputs.matrix).length || '0' }}"
          
          echo "========================================="
          echo "          SCRAPING SUMMARY"
          echo "========================================="
          echo "Site Name:       $SITE_NAME"
          echo "Site URL:        $SITE_URL"
          echo "Output File:     $OUTPUT_FILE"
          echo ""
          echo "Job Status:"
          echo "  Planned Jobs:  $PLANNED_JOBS"
          echo "  Successful:    $SUCCESSFUL_CHUNKS"
          echo "  Failed:        $((PLANNED_JOBS - SUCCESSFUL_CHUNKS))"
          echo ""
          echo "Results:"
          echo "  Total Files:    $FILE_COUNT chunks"
          echo "  Total Products: $TOTAL_ROWS rows"
          echo ""
          echo "Configuration:"
          echo "  Max Workers:   ${{ github.event.inputs.max_workers }}"
          echo "  Request Delay: ${{ github.event.inputs.request_delay }}s"
          echo "  URLs/Sitemap:  ${{ github.event.inputs.urls_per_sitemap }}"
          echo "  Sitemaps/Job:  ${{ github.event.inputs.sitemaps_per_job }}"
          echo "  Total Sitemaps: ${{ github.event.inputs.total_sitemaps }}"
          echo "  Sample Size:   ${{ github.event.inputs.sample_size }}"
          echo "  FlareSolverr:  Enabled (Service Container)"
          echo "========================================="
          
          if [ -f "products_full.csv" ]; then
            echo ""
            echo "First 3 rows of data:"
            echo "======================"
            head -n 4 products_full.csv
          else
            echo ""
            echo "No data was successfully scraped!"
          fi

      - name: Archive results (if any)
        if: steps.merge_csv.outputs.final_rows > 0
        uses: actions/upload-artifact@v4
        with:
          name: final_results
          path: |
            ${{ steps.meta.outputs.name }}
          retention-days: 7