name: Unlimited Furniture - Parallel Sitemap Scraper

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base site URL"
        required: true
        default: "https://www.unlimitedfurnituregroup.com"
      total_sitemaps:
        description: "Total sitemaps to process (0 = auto / all)"
        default: "0"
      sitemaps_per_job:
        description: "Sitemaps per parallel job"
        default: "2"
      urls_per_sitemap:
        description: "Max URLs per sitemap (0 = all)"
        default: "0"
      max_workers:
        description: "Parallel requests per job"
        default: "4"
      request_delay:
        description: "Delay between requests (seconds)"
        default: "0.5"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      site_name: ${{ steps.get_site_name.outputs.site_name }}
    steps:
      - name: Extract site name from URL
        id: get_site_name
        run: |
          URL="${{ github.event.inputs.url }}"
          SITE_NAME=$(echo "$URL" | sed -E 's|https?://||;s|www\.||;s|\.[a-zA-Z]+(/.*)?$||;s|/.*||')
          echo "site_name=$SITE_NAME" >> $GITHUB_OUTPUT
          echo "Site name: $SITE_NAME"

      - name: Build job matrix
        id: matrix
        env:
          BASE_URL: ${{ github.event.inputs.url }}
          TOTAL_SITEMAPS: ${{ github.event.inputs.total_sitemaps }}
          PER_JOB: ${{ github.event.inputs.sitemaps_per_job }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request
          import re
          from xml.etree import ElementTree as ET

          url = os.environ.get("BASE_URL", "https://www.unlimitedfurnituregroup.com").rstrip("/")
          total_input = int(os.environ.get("TOTAL_SITEMAPS", "0") or "0")
          per_job = int(os.environ.get("PER_JOB", "2") or "2")
          if per_job < 1:
              per_job = 2

          # Discover sitemaps from robots.txt or defaults
          index_urls = []
          try:
              req = urllib.request.Request(f"{url}/robots.txt", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  for line in resp.read().decode("utf-8").splitlines():
                      if line.strip().lower().startswith("sitemap:"):
                          s = line.split(":", 1)[1].strip()
                          if s and s not in index_urls:
                              index_urls.append(s)
          except Exception as e:
              print(f"Robots fetch error: {e}")

          if not index_urls:
              index_urls = [f"{url}/sitemap.xml", f"{url}/pub/sitemap/sitemap.xml"]

          child_sitemaps = []
          for idx in index_urls:
              try:
                  req = urllib.request.Request(idx, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      text = resp.read().decode("utf-8")
                      text = re.sub(r'<script[^>]*/>', '', text)
                      text = re.sub(r'<script[^>]*>.*?</script>', '', text, flags=re.DOTALL)
                      root = ET.fromstring(text)
                      for loc in root.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc'):
                          if loc.text and loc.text.strip() not in child_sitemaps:
                              child_sitemaps.append(loc.text.strip())
              except Exception as e:
                  print(f"Error parsing sitemap index {idx}: {e}")

          total_found = len(child_sitemaps) or 32
          print(f"Discovered {total_found} child sitemaps in total.")

          if total_input > 0:
              total_to_process = min(total_input, total_found)
          else:
              total_to_process = total_found

          jobs = (total_to_process + per_job - 1) // per_job
          matrix = []
          for i in range(jobs):
              offset = i * per_job
              limit = min(per_job, total_to_process - offset)
              matrix.append({
                  "offset": offset,
                  "limit": limit,
                  "url": url
              })

          matrix_json = json.dumps(matrix)
          print(f"Planned {len(matrix)} jobs for {total_to_process} sitemaps (per job: {per_job})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={matrix_json}\n")
          EOF

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml urllib3 curl_cffi

      - name: Run unlimitedfurniture scraper
        env:
          CURR_URL:             ${{ matrix.url }}
          SITEMAP_OFFSET:       ${{ matrix.offset }}
          MAX_SITEMAPS:         ${{ matrix.limit }}
          MAX_URLS_PER_SITEMAP: ${{ github.event.inputs.urls_per_sitemap }}
          MAX_WORKERS:          ${{ github.event.inputs.max_workers }}
          REQUEST_DELAY:        ${{ github.event.inputs.request_delay }}
        run: |
          echo "========================================"
          echo " unlimitedfurniture Scraper — Job Configuration"
          echo "========================================"
          echo "CURR_URL             : $CURR_URL"
          echo "SITEMAP_OFFSET       : $SITEMAP_OFFSET"
          echo "MAX_SITEMAPS         : $MAX_SITEMAPS"
          echo "MAX_URLS_PER_SITEMAP : $MAX_URLS_PER_SITEMAP"
          echo "MAX_WORKERS          : $MAX_WORKERS"
          echo "REQUEST_DELAY        : $REQUEST_DELAY"
          echo "========================================"

          python unlimited_furniture/unlimited_furniture.py

          echo ""
          echo "Generated files:"
          ls -la media/output/scrapping/unlimitedfurniture/unlimitedfurniture_products_chunk_*.csv 2>/dev/null || echo "No CSV files generated"

      - name: Upload chunk artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunk_${{ matrix.offset }}
          path: |
            url_list_chunk_*.txt
            media/output/scrapping/unlimitedfurniture/unlimitedfurniture_products_chunk_*.csv
            media/output/scrapping/failure_csv/unlimitedfurniture_failures.csv
            media/output/scrapping/failure_csv/unlimitedfurniture_skipped_plp_*.csv
          if-no-files-found: warn

  merge:
    needs: [plan, scrape]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        with:
          path: chunks
          pattern: chunk_*
          merge-multiple: true

      - name: Merge CSV chunks
        id: merge_csv
        run: |
          echo "Merging CSV chunks..."

          CSV_FILES=$(find chunks -name "unlimitedfurniture_products_chunk_*.csv" 2>/dev/null)

          if [ -z "$CSV_FILES" ]; then
            echo "ERROR: No CSV files found!"
            ls -la chunks/ 2>/dev/null || echo "chunks/ directory not found"
            exit 1
          fi

          echo "Found files:"
          echo "$CSV_FILES"

          FIRST_FILE=$(echo "$CSV_FILES" | head -n 1)
          head -n 1 "$FIRST_FILE" > unlimitedfurniture_products_full.csv

          TOTAL_ROWS=0
          FILE_COUNT=0
          for f in $CSV_FILES; do
            if [ -f "$f" ]; then
              FILE_COUNT=$((FILE_COUNT + 1))
              ROWS=$(tail -n +2 "$f" | wc -l)
              TOTAL_ROWS=$((TOTAL_ROWS + ROWS))
              echo "  $f — $ROWS rows"
              tail -n +2 "$f" | sed '/^$/d' >> unlimitedfurniture_products_full.csv
            fi
          done

          FINAL_ROWS=$(tail -n +2 unlimitedfurniture_products_full.csv | wc -l)
          echo "Merged: $FINAL_ROWS rows from $FILE_COUNT chunk files"

          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "final_rows=$FINAL_ROWS" >> $GITHUB_OUTPUT

      - name: Merge failure logs
        if: always()
        run: |
          FAIL_FILES=$(find chunks -name "unlimitedfurniture_failures.csv" 2>/dev/null)
          if [ -z "$FAIL_FILES" ]; then
            echo "No failure logs found."
            exit 0
          fi

          FIRST=$(echo "$FAIL_FILES" | head -n 1)
          head -n 1 "$FIRST" > unlimitedfurniture_failures_full.csv
          for f in $FAIL_FILES; do
            tail -n +2 "$f" | sed '/^$/d' >> unlimitedfurniture_failures_full.csv
          done

          FAIL_COUNT=$(tail -n +2 unlimitedfurniture_failures_full.csv | wc -l)
          echo "Total failed URLs: $FAIL_COUNT"

      - name: Merge skipped PLP logs
        if: always()
        run: |
          SKIPPED_FILES=$(find chunks -name "unlimitedfurniture_skipped_plp_*.csv" 2>/dev/null)
          if [ -z "$SKIPPED_FILES" ]; then
            echo "No skipped PLP logs found."
            exit 0
          fi

          FIRST=$(echo "$SKIPPED_FILES" | head -n 1)
          head -n 1 "$FIRST" > skipped_plp.csv
          for f in $SKIPPED_FILES; do
            tail -n +2 "$f" | sed '/^$/d' >> skipped_plp.csv
          done

          SKIPPED_COUNT=$(tail -n +2 skipped_plp.csv | wc -l)
          echo "Total skipped PLP URLs: $SKIPPED_COUNT"

      - name: Build output filename
        id: meta
        run: |
          SITE_NAME="${{ needs.plan.outputs.site_name }}"
          [ -z "$SITE_NAME" ] && SITE_NAME="unlimitedfurniture"
          DATE=$(date +%F_%H%M%S)
          FILENAME="${SITE_NAME}_${DATE}.csv"
          echo "name=$FILENAME" >> $GITHUB_OUTPUT
          echo "Output filename: $FILENAME"

      - name: Merge per-chunk URL lists
        id: merge_urls
        run: |
          find chunks -name "url_list_chunk_*.txt" 2>/dev/null | sort | xargs cat 2>/dev/null | sort -u > all_sitemap_urls.txt || true
          URL_COUNT=$(wc -l < all_sitemap_urls.txt | tr -d ' ')
          echo "Total unique sitemap URLs: $URL_COUNT"
          echo "url_count=$URL_COUNT" >> $GITHUB_OUTPUT

      - name: Build FTP directory structure
        id: ftp_structure
        run: |
          DATE=$(date +%Y%m%d)
          TIMESTAMP=$(date +%Y%m%d%H%M)
          COMPETITOR="Unlimitedfurniture"

          echo "competitor=$COMPETITOR" >> $GITHUB_OUTPUT
          echo "date_str=$DATE" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          INPUT_DIR="ftp_output/${COMPETITOR}/${DATE}/input"
          TEMP_DIR="ftp_output/${COMPETITOR}/${DATE}/output/temp"
          FINAL_DIR="ftp_output/${COMPETITOR}/${DATE}/output"

          mkdir -p "$INPUT_DIR" "$TEMP_DIR" "$FINAL_DIR"

          INPUT_URL="$INPUT_DIR/URLList${TIMESTAMP}.csv"
          TEMP_URL="$TEMP_DIR/URLListForScrap${TIMESTAMP}.csv"
          FINAL_SCRAPED="$FINAL_DIR/FinalScrappedData${TIMESTAMP}.csv"
          FINAL_URL="$FINAL_DIR/FinalURLListForScrap${TIMESTAMP}.csv"

          cp all_sitemap_urls.txt "$INPUT_URL" 2>/dev/null || true
          cp all_sitemap_urls.txt "$TEMP_URL" 2>/dev/null || true
          cp unlimitedfurniture_products_full.csv "$FINAL_SCRAPED" 2>/dev/null || true

          echo "FTP structure prepared:"
          find ftp_output -type f | sort

      - name: Generate FinalURLListForScrap
        run: |
          COMPETITOR="${{ steps.ftp_structure.outputs.competitor }}"
          DATE="${{ steps.ftp_structure.outputs.date_str }}"
          TIMESTAMP="${{ steps.ftp_structure.outputs.timestamp }}"

          SCRAPED="ftp_output/${COMPETITOR}/${DATE}/output/FinalScrappedData${TIMESTAMP}.csv"
          URLS="ftp_output/${COMPETITOR}/${DATE}/output/temp/URLListForScrap${TIMESTAMP}.csv"
          OUT="ftp_output/${COMPETITOR}/${DATE}/output/FinalURLListForScrap${TIMESTAMP}.csv"

          if [ -f "$URLS" ] && [ -f "$SCRAPED" ] && [ -s "$SCRAPED" ]; then
            python3 ftp_manager.py track-urls --sitemap-file "$URLS" --scraped-file "$SCRAPED" --output-file "$OUT" || true
            echo "Generated FinalURLListForScrap: $OUT"
          fi

      - name: Upload to FTP
        run: |
          if [ -n "$FTP_HOST" ]; then
            COMPETITOR="${{ steps.ftp_structure.outputs.competitor }}"
            DATE="${{ steps.ftp_structure.outputs.date_str }}"
            echo "Uploading $COMPETITOR output to FTP server..."
            python3 ftp_manager.py upload -c "$COMPETITOR" -b ftp_output || {
              echo "ftp_manager upload failed, falling back to lftp..."
              which lftp >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y lftp)
              BASE="${FTP_PATH:-$FTP_BASE_DIR}/${COMPETITOR}/${DATE}"
              lftp -e "set ftp:ssl-allow no; mirror -R ftp_output/${COMPETITOR}/${DATE} ${BASE}; bye" -u "$FTP_USER","$FTP_PASS" -p "${FTP_PORT:-21}" "$FTP_HOST" || true
              echo "FTP upload complete: ${BASE}"
            } || true
          else
            echo "FTP_HOST not configured - skipping upload"
          fi
        env:
          FTP_HOST:     ${{ secrets.FTP_HOST }}
          FTP_USER:     ${{ secrets.FTP_USER }}
          FTP_PASS:     ${{ secrets.FTP_PASS }}
          FTP_PORT:     ${{ secrets.FTP_PORT || '21' }}
          FTP_PATH:     ${{ secrets.FTP_PATH || secrets.FTP_BASE_DIR }}
          FTP_BASE_DIR: ${{ secrets.FTP_PATH || secrets.FTP_BASE_DIR }}

      - name: Upload merged CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unlimitedfurniture_products_full
          path: |
            unlimitedfurniture_products_full.csv
            unlimitedfurniture_failures_full.csv
            skipped_plp.csv
          if-no-files-found: warn
