name: Shopify - Product Scraper

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base site URL (e.g., https://www.afastores.com or https://www.franceandson.com)"
        required: true
        default: "https://www.afastores.com"
      total_sitemaps:
        description: "Total sitemaps to process (0 = auto-detect all)"
        default: "0"
      sitemaps_per_job:
        description: "Sitemaps per parallel job"
        default: "2"
      urls_per_sitemap:
        description: "Max URLs per sitemap (0 = scrape all products)"
        default: "0"
      max_workers:
        description: "Parallel requests per job (recommended 1-2 to prevent Cloudflare rate-limits)"
        default: "2"
      request_delay:
        description: "Base delay between requests in seconds"
        default: "1.5"

env:
  PYTHON_VERSION: '3.11'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      total_sitemaps_found: ${{ steps.discovery.outputs.total_sitemaps }}

    # Service container for Cloudflare bypass during sitemap discovery
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: --cap-add=SYS_ADMIN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for FlareSolverr to be ready
        run: |
          echo "Waiting for FlareSolverr service to be ready..."
          sleep 5
          for i in {1..30}; do
            if curl -s -f -X POST http://localhost:8191/v1 \
              -H "Content-Type: application/json" \
              -d '{"cmd": "sessions.list"}' > /dev/null 2>&1; then
              echo "✓ FlareSolverr is ready!"
              break
            fi
            echo "Attempt $i: FlareSolverr not ready yet..."
            sleep 2
            if [ $i -eq 30 ]; then
              echo "❌ FlareSolverr failed to start after 60 seconds"
              docker logs flaresolverr || true
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi requests cloudscraper lxml

      - name: Discover sitemap structure
        id: discovery
        env:
          URL: ${{ github.event.inputs.url }}
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          PROXY: ${{ secrets.PROXY || secrets.HTTPS_PROXY || '' }}
        run: |
          python3 - << 'EOF'
          import os, sys, re, xml.etree.ElementTree as ET
          from curl_cffi import requests
          import requests as py_req

          url = os.environ.get("URL", "").rstrip("/")
          sitemap_index = f"{url}/sitemap.xml"
          proxy = os.environ.get("PROXY")
          proxies = {"http": proxy, "https": proxy} if proxy else None

          print(f"Discovering sitemaps for: {url}")
          sitemaps = []

          # 1. Try curl_cffi with Chrome 120 impersonation
          try:
              r = requests.get(sitemap_index, impersonate="chrome120", timeout=25, proxies=proxies)
              if r.status_code == 200 and "<?xml" in r.text:
                  locs = re.findall(r'<loc>([^<]+)</loc>', r.text)
                  prod_locs = [s.strip() for s in locs if "product" in s.lower()]
                  sitemaps = prod_locs if prod_locs else [s.strip() for s in locs]
          except Exception as e:
              print(f"curl_cffi attempt notice: {e}")

          # 2. Fallback to FlareSolverr if challenged/empty
          if not sitemaps:
              fs_url = os.environ.get("FLARESOLVERR_URL")
              if fs_url:
                  try:
                      print("Attempting sitemap discovery via FlareSolverr...")
                      fs_endpoint = f"{fs_url}/v1" if not fs_url.endswith("/v1") else fs_url
                      payload = {"cmd": "request.get", "url": sitemap_index, "maxTimeout": 60000}
                      if proxy:
                          payload["proxy"] = {"url": proxy}
                      res = py_req.post(fs_endpoint, json=payload, timeout=70)
                      print(f"FlareSolverr HTTP status: {res.status_code}")
                      if res.status_code == 200:
                          data = res.json()
                          if data.get("status") == "ok":
                              resp_text = data.get("solution", {}).get("response", "")
                              locs = re.findall(r'<loc>([^<]+)</loc>', resp_text)
                              prod_locs = [s.strip() for s in locs if "product" in s.lower()]
                              sitemaps = prod_locs if prod_locs else [s.strip() for s in locs]
                              print(f"FlareSolverr discovered {len(sitemaps)} sitemaps")
                          else:
                              print(f"FlareSolverr message: {data.get('message')}")
                      else:
                          print(f"FlareSolverr error body: {res.text[:200]}")
                  except Exception as e:
                      print(f"FlareSolverr attempt notice: {e}")

          # Known site sitemap totals for safe fallback
          fallback_counts = {
              "afastores": 209,
              "franceandson": 57,
              "graysonliving": 60,
          }
          default_count = 20
          for k, v in fallback_counts.items():
              if k in url.lower():
                  default_count = v
                  break

          count = len(sitemaps) if sitemaps else default_count
          print(f"Final total product sitemaps to process: {count}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"total_sitemaps={count}\n")
          EOF

      - name: Generate job matrix
        id: matrix
        run: |
          DISCOVERED=${{ steps.discovery.outputs.total_sitemaps }}
          USER_INPUT=${{ github.event.inputs.total_sitemaps }}
          
          if [ "$USER_INPUT" -gt 0 ]; then
            TOTAL=$USER_INPUT
          elif [ "$DISCOVERED" -gt 0 ]; then
            TOTAL=$DISCOVERED
          else
            TOTAL=20
          fi
          
          PER_JOB=${{ github.event.inputs.sitemaps_per_job }}
          URL="${{ github.event.inputs.url }}"
          REQ_DELAY="${{ github.event.inputs.request_delay }}"
          
          JOBS=$(( (TOTAL + PER_JOB - 1) / PER_JOB ))
          
          MATRIX="["
          for ((i=0;i<JOBS;i++)); do
            OFFSET=$(( i * PER_JOB ))
            MATRIX+="{\"offset\":$OFFSET,\"limit\":$PER_JOB,\"url\":\"$URL\",\"request_delay\":\"$REQ_DELAY\"},"
          done
          MATRIX="${MATRIX%,}]"
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Total: $TOTAL sitemaps, $JOBS jobs"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    # Service container for Cloudflare Turnstile bypass during scraping
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: --cap-add=SYS_ADMIN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for FlareSolverr to be ready
        run: |
          echo "Waiting for FlareSolverr service to be ready..."
          sleep 5
          for i in {1..30}; do
            if curl -s -f -X POST http://localhost:8191/v1 \
              -H "Content-Type: application/json" \
              -d '{"cmd": "sessions.list"}' > /dev/null 2>&1; then
              echo "✓ FlareSolverr is ready!"
              break
            fi
            echo "Attempt $i: FlareSolverr not ready yet..."
            sleep 2
            if [ $i -eq 30 ]; then
              echo "❌ FlareSolverr failed to start after 60 seconds"
              docker logs flaresolverr || true
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libcurl4-openssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper curl-cffi requests lxml

      - name: Run Cloudflare-resistant scraper
        env:
          CURR_URL: ${{ matrix.url }}
          SITEMAP_OFFSET: ${{ matrix.offset }}
          MAX_SITEMAPS: ${{ matrix.limit }}
          MAX_URLS_PER_SITEMAP: ${{ github.event.inputs.urls_per_sitemap }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers }}
          REQUEST_DELAY_BASE: ${{ matrix.request_delay }}
          FLARESOLVERR_URL: "http://localhost:8191/v1"
          FLARESOLVERR_TIMEOUT: "120"
          PROXY: ${{ secrets.PROXY || secrets.HTTPS_PROXY || '' }}
        run: |
          # Jitter runner start to prevent synchronized bursts against Cloudflare WAF
          JITTER=$((RANDOM % 25 + 5))
          echo "Jitter delay: sleeping ${JITTER}s before starting..."
          sleep $JITTER
          python shopify-scrapper/shopifyscrap-cloudflare.py

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunk_${{ matrix.offset }}
          path: |
            products_chunk_*.csv
            url_list_chunk_*.txt
          retention-days: 1

  merge:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        with:
          path: chunks
          pattern: chunk_*
          merge-multiple: false

      - name: Merge CSV chunks
        run: |
          echo "Merging CSV files..."
          
          # Find all CSV files
          find chunks -name "*.csv" -type f | sort > csv_files.txt
          
          if [ ! -s csv_files.txt ]; then
            echo "No CSV files found to merge!"
            exit 1
          fi
          
          FIRST_FILE=$(head -n 1 csv_files.txt)
          
          # Create merged file with header from first file
          head -n 1 "$FIRST_FILE" > products_full.csv
          
          # Append data from all files (skip headers)
          while IFS= read -r csv_file; do
            echo "Adding: $csv_file"
            tail -n +2 "$csv_file" >> products_full.csv
          done < csv_files.txt
          
          ROW_COUNT=$(tail -n +2 products_full.csv | wc -l | tr -d ' ')
          echo "Merged $ROW_COUNT product rows"

      - name: Generate output filename
        id: filename
        run: |
          SITE=$(echo "${{ github.event.inputs.url }}" | sed -E 's|https?://||;s|/.*||')
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "filename=${SITE}_products_${TIMESTAMP}.csv" >> $GITHUB_OUTPUT
          echo "Output file: ${SITE}_products_${TIMESTAMP}.csv"


      - name: Merge per-chunk URL lists
        id: merge_urls
        run: |
          find chunks -name "url_list_chunk_*.txt" 2>/dev/null | sort | xargs cat 2>/dev/null | sort -u > all_sitemap_urls.txt || true
          URL_COUNT=$(wc -l < all_sitemap_urls.txt | tr -d ' ')
          echo "Total unique sitemap URLs: $URL_COUNT"
          echo "url_count=$URL_COUNT" >> $GITHUB_OUTPUT

      - name: Build FTP directory structure
        id: ftp_structure
        run: |
          DATE=$(date +%Y%m%d)
          TIMESTAMP=$(date +%Y%m%d%H%M)
          
          # Extract competitor name from domain (e.g. afastores.com -> afastores)
          SITE_DOMAIN=$(echo "${{ github.event.inputs.url }}" | sed -E 's|https?://||;s|/.*||;s|^www\.||')
          COMPETITOR=$(echo "$SITE_DOMAIN" | cut -d'.' -f1)

          echo "competitor=$COMPETITOR" >> $GITHUB_OUTPUT
          echo "date_str=$DATE" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

          mkdir -p "ftp_output/${COMPETITOR}/${DATE}/input"
          mkdir -p "ftp_output/${COMPETITOR}/${DATE}/output/temp"

          cp all_sitemap_urls.txt "ftp_output/${COMPETITOR}/${DATE}/input/URLList${TIMESTAMP}.csv" 2>/dev/null || true
          cp all_sitemap_urls.txt "ftp_output/${COMPETITOR}/${DATE}/output/temp/URLListForScrap${TIMESTAMP}.csv" 2>/dev/null || true
          cp products_full.csv "ftp_output/${COMPETITOR}/${DATE}/output/FinalScrappedData${TIMESTAMP}.csv" 2>/dev/null || true

          echo "FTP structure:"
          find ftp_output -type f | sort

      - name: Generate FinalURLListForScrap
        run: |
          COMPETITOR="${{ steps.ftp_structure.outputs.competitor }}"
          DATE="${{ steps.ftp_structure.outputs.date_str }}"
          TIMESTAMP="${{ steps.ftp_structure.outputs.timestamp }}"

          SCRAPED="ftp_output/${COMPETITOR}/${DATE}/output/FinalScrappedData${TIMESTAMP}.csv"
          URLS="ftp_output/${COMPETITOR}/${DATE}/output/temp/URLListForScrap${TIMESTAMP}.csv"
          OUT="ftp_output/${COMPETITOR}/${DATE}/output/FinalURLListForScrap${TIMESTAMP}.csv"

          if [ -f "$URLS" ] && [ -f "$SCRAPED" ]; then
            python3 ftp_manager.py track-urls --sitemap-file "$URLS" --scraped-file "$SCRAPED" --output-file "$OUT"
            echo "Generated FinalURLListForScrap: $OUT"
          fi

      - name: Upload to FTP (structured path)
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "FTP credentials not set — skipping upload."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y lftp
          COMPETITOR="${{ steps.ftp_structure.outputs.competitor }}"
          DATE="${{ steps.ftp_structure.outputs.date_str }}"
          BASE="${FTP_BASE_DIR}/${COMPETITOR}/${DATE}"
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          mirror -R ftp_output/${COMPETITOR}/${DATE} ${BASE}
          bye
          EOF
          echo "FTP upload complete: ${BASE}"
        env:
          FTP_HOST:     ${{ secrets.FTP_HOST }}
          FTP_USER:     ${{ secrets.FTP_USER }}
          FTP_PASS:     ${{ secrets.FTP_PASS }}
          FTP_BASE_DIR: ${{ secrets.FTP_PATH }}

      - name: Upload merged CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged_products
          path: products_full.csv
          retention-days: 7

      - name: Create summary report
        run: |
          TOTAL_CHUNKS=$(find chunks -mindepth 1 -maxdepth 1 -type d | wc -l)
          TOTAL_ROWS=$(tail -n +2 products_full.csv 2>/dev/null | wc -l | tr -d ' ' || echo "0")
          
          echo "## Scraping Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Target URL**: ${{ github.event.inputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Chunks**: $TOTAL_CHUNKS" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Products**: $TOTAL_ROWS" >> $GITHUB_STEP_SUMMARY
          echo "- **Output File**: ${{ steps.filename.outputs.filename }}" >> $GITHUB_STEP_SUMMARY
          
          if [ $TOTAL_ROWS -gt 0 ]; then
            echo "✅ Scraping completed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Warning: No products were scraped" >> $GITHUB_STEP_SUMMARY
          fi