name: Coleman Furniture - Brand Scraper (API / FTP / Sitemap)

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "Input source type for URL collection (FTP, API, Sitemap, Direct URLs)"
        required: true
        default: "FTP"
        type: choice
        options:
          - "FTP"
          - "API"
          - "Sitemap"
          - "Direct URLs"
      ftp_filename:
        description: "CSV path on FTP server (e.g., input_urls/coleman FTP urls.csv or emma-mason.csv)"
        required: false
        default: ""
        type: string
      base_api:
        description: "Base API URL endpoint (for API mode)"
        required: false
        default: "https://colemanfurniture.com/manufacturer/detail/250"
        type: string
      start_page:
        description: "Start page for URL collection (for API mode)"
        default: "1"
        type: string
      end_page:
        description: "End page for URL collection (for API mode)"
        default: "150"
        type: string
      sitemap_url:
        description: "Sitemap URL (for Sitemap mode)"
        default: "https://colemanfurniture.com/sitemap/sitemap_index.xml.gz"
        type: string
      direct_urls:
        description: "Direct URLs list (comma or newline separated for Direct URLs mode)"
        default: ""
        type: string
      urls_per_job:
        description: "Number of URLs to scrape per parallel job"
        default: "500"
        type: number
      max_workers:
        description: "Max concurrent workers per job"
        default: "12"
        type: number
      max_rounds:
        description: "Max recursion rounds (workflow re-triggers)"
        default: "50"
        type: number
      # ── Internal inputs (set automatically on re-trigger) ──
      current_round:
        description: "[Internal] Current recursion round"
        default: "1"
        type: number
      remaining_run_id:
        description: "[Internal] Run ID that produced the merged remaining CSV"
        default: ""
        type: string

permissions:
  actions: write
  contents: read

env:
  WEBSITE_URL:      "https://colemanfurniture.com"
  SOURCE_TYPE:      ${{ github.event.inputs.source_type }}
  FTP_HOST:         ${{ secrets.FTP_HOST || 'ftp-sandbox.1sb.pp.ua' }}
  FTP_PORT:         ${{ secrets.FTP_PORT || '21' }}
  FTP_USER:         ${{ secrets.FTP_USER || 'onestop_ftp-sandbox' }}
  FTP_PASS:         ${{ secrets.FTP_PASS || 'OneStop123' }}
  FTP_PATH:         ${{ secrets.FTP_PATH || '/scrap/' }}
  FTP_FILENAME:     ${{ github.event.inputs.ftp_filename }}
  BASE_API:         ${{ github.event.inputs.base_api }}
  START_PAGE:       ${{ github.event.inputs.start_page }}
  END_PAGE:         ${{ github.event.inputs.end_page }}
  SITEMAP_URL:      ${{ github.event.inputs.sitemap_url }}
  DIRECT_URLS:      ${{ github.event.inputs.direct_urls }}
  URLS_PER_JOB:     ${{ github.event.inputs.urls_per_job }}
  MAX_WORKERS:      ${{ github.event.inputs.max_workers }}
  MAX_ROUNDS:       ${{ github.event.inputs.max_rounds }}
  CURRENT_ROUND:    ${{ github.event.inputs.current_round }}
  REMAINING_RUN_ID: ${{ github.event.inputs.remaining_run_id }}

jobs:

  # ── PLAN ──────────────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix:      ${{ steps.build_matrix.outputs.matrix }}
      domain:      ${{ steps.domain.outputs.domain }}
      mode:        ${{ steps.build_matrix.outputs.mode }}
      total_jobs:  ${{ steps.build_matrix.outputs.total_jobs }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract domain
        id: domain
        run: |
          URL="${{ env.WEBSITE_URL }}"
          DOMAIN=$(echo "$URL" | sed -E 's|https?://||;s|/.*||' | sed 's/[^a-zA-Z0-9]/_/g')
          API_PATH=$(echo "${{ env.BASE_API }}" | sed -E 's|\?.*||' | sed -E 's|https?://[^/]+||')
          MFG_ID=$(echo "$API_PATH" | tr -d ' ' | tr '/' '\n' | tail -n 1)
          [ -z "$MFG_ID" ] && MFG_ID="file"
          DOMAIN="${DOMAIN}_file_${MFG_ID}"
          echo "domain=$DOMAIN" >> $GITHUB_OUTPUT

      - name: Download merged remaining CSV (retry mode)
        if: env.REMAINING_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: remaining_merged
          run-id: ${{ env.REMAINING_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: remaining_input

      - name: Set up Python for Initial Round
        if: env.REMAINING_RUN_ID == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for Initial Round
        if: env.REMAINING_RUN_ID == ''
        run: |
          python -m pip install --upgrade pip
          if [ -f "colemanfurniture_brand_file_scraper/requirements.txt" ]; then
            pip install -r colemanfurniture_brand_file_scraper/requirements.txt
          else
            pip install scrapy pandas lxml requests beautifulsoup4
          fi

      - name: Build matrix
        id: build_matrix
        run: |
          URL="${{ env.WEBSITE_URL }}"
          DOMAIN="${{ steps.domain.outputs.domain }}"
          PER_JOB="${{ env.URLS_PER_JOB }}"
          ROUND="${{ env.CURRENT_ROUND }}"

          if [ -n "${{ env.REMAINING_RUN_ID }}" ] && [ -f "remaining_input/remaining_merged.csv" ]; then
            echo "=== RETRY MODE (round $ROUND) ==="
            REMAINING_FILE="remaining_input/remaining_merged.csv"
          else
            echo "=== INITIAL MODE (round $ROUND) ==="
            echo "Collecting URLs for Source Type: ${{ env.SOURCE_TYPE }}"
            mkdir -p remaining_input

            python colemanfurniture_brand_file_scraper/scripts/fetch_input_urls.py \
              --source-type "${{ env.SOURCE_TYPE }}" \
              --ftp-host "${{ env.FTP_HOST }}" \
              --ftp-port "${{ env.FTP_PORT }}" \
              --ftp-user "${{ env.FTP_USER }}" \
              --ftp-pass "${{ env.FTP_PASS }}" \
              --ftp-path "${{ env.FTP_PATH }}" \
              --ftp-filename "${{ env.FTP_FILENAME }}" \
              --sitemap-url "${{ env.SITEMAP_URL }}" \
              --base-api "${{ env.BASE_API }}" \
              --start-page "${{ env.START_PAGE }}" \
              --end-page "${{ env.END_PAGE }}" \
              --urls "${{ env.DIRECT_URLS }}" \
              --output-file "remaining_input/remaining_merged.csv"
            
            REMAINING_FILE="remaining_input/remaining_merged.csv"
          fi

          if [ ! -f "$REMAINING_FILE" ]; then
            echo "Error: Remaining file $REMAINING_FILE was not generated"
            exit 1
          fi

          TOTAL_URLS=$(tail -n +2 "$REMAINING_FILE" | grep -v '^$' | wc -l)
          echo "Total URLs to process: $TOTAL_URLS"

          if [ "$TOTAL_URLS" -eq 0 ]; then
            echo "No URLs found — nothing to scrape."
            echo 'matrix=[]' >> $GITHUB_OUTPUT
            echo 'mode=empty'  >> $GITHUB_OUTPUT
            echo 'total_jobs=0' >> $GITHUB_OUTPUT
            exit 0
          fi

          MAX_JOBS=200
          CHUNK_SIZE=$PER_JOB
          [ "$CHUNK_SIZE" -lt 1 ] && CHUNK_SIZE=500
          JOBS=$(( (TOTAL_URLS + CHUNK_SIZE - 1) / CHUNK_SIZE ))
          [ $JOBS -eq 0 ] && JOBS=1
          
          if [ "$JOBS" -gt "$MAX_JOBS" ]; then
            CHUNK_SIZE=$(( (TOTAL_URLS + MAX_JOBS - 1) / MAX_JOBS ))
            JOBS=$MAX_JOBS
            echo "⚠ Adjusted chunk size to $CHUNK_SIZE to stay within $MAX_JOBS job limit"
          fi

          mkdir -p remaining_chunks
          HEADER=$(head -n 1 "$REMAINING_FILE")
          tail -n +2 "$REMAINING_FILE" | grep -v '^$' | split -l "$CHUNK_SIZE" - remaining_chunks/chunk_

          MATRIX="["
          IDX=0
          for CHUNK_FILE in remaining_chunks/chunk_*; do
            echo "$HEADER" > "remaining_chunks/urls_${IDX}.csv"
            cat "$CHUNK_FILE"  >> "remaining_chunks/urls_${IDX}.csv"
            MATRIX+="{\"job_index\":$IDX,\"domain\":\"$DOMAIN\",\"chunk_file\":\"remaining_chunks/urls_${IDX}.csv\"},"
            IDX=$(( IDX + 1 ))
          done
          MATRIX="${MATRIX%,}]"
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "mode=scrape"    >> $GITHUB_OUTPUT
          echo "total_jobs=$JOBS" >> $GITHUB_OUTPUT
          echo "Built matrix: $JOBS jobs for $TOTAL_URLS URLs"

      - name: Upload chunk files
        if: steps.build_matrix.outputs.mode == 'scrape'
        uses: actions/upload-artifact@v4
        with:
          name: chunks_round_${{ env.CURRENT_ROUND }}
          path: remaining_chunks/urls_*.csv
          retention-days: 1

  # ── SCRAPE ────────────────────────────────────────────────────────────────
  scrape:
    needs: plan
    if: needs.plan.outputs.mode != 'empty'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "colemanfurniture_brand_file_scraper/requirements.txt" ]; then
            pip install -r colemanfurniture_brand_file_scraper/requirements.txt
          else
            pip install scrapy pandas lxml requests beautifulsoup4
          fi

      - name: Create output directory
        run: mkdir -p output

      - name: Download chunk
        uses: actions/download-artifact@v4
        with:
          name: chunks_round_${{ env.CURRENT_ROUND }}
          path: retry_input

      - name: Run scraper
        env:
          MAX_WORKERS: ${{ env.MAX_WORKERS }}
        run: |
          JOB_IDX="${{ matrix.job_index }}"
          DOMAIN="${{ matrix.domain }}"
          ROUND="${{ env.CURRENT_ROUND }}"
          TIMESTAMP="${GITHUB_RUN_ID}"
          
          JOB_ID="job${JOB_IDX}_r${ROUND}"
          CHUNK_BASENAME="urls_${JOB_IDX}.csv"
          URLS_FILE="retry_input/${CHUNK_BASENAME}"
          
          echo "=== Scrape job $JOB_IDX | round=$ROUND ==="
          echo "Loading URLs from: $URLS_FILE"

          python colemanfurniture_brand_file_scraper/scripts/run.py \
            --website-url "${{ env.WEBSITE_URL }}" \
            --job-id "$JOB_ID" \
            --output-dir output \
            --urls-file "$URLS_FILE" \
            --verbose

          OUTPUT_CSV=$(ls output/output_*_${JOB_ID}_${TIMESTAMP}.csv 2>/dev/null || echo "")
          REMAINING_CSV=$(ls output/remaining_*_${JOB_ID}_${TIMESTAMP}.csv 2>/dev/null || \
                          ls output/remaining_*_${JOB_ID}.csv 2>/dev/null || echo "")
          UNSCRAPED_CSV=$(ls output/unscraped_*_${JOB_ID}_${TIMESTAMP}.csv 2>/dev/null || \
                          ls output/unscraped_*_${JOB_ID}.csv 2>/dev/null || echo "")

          # Normalise names for upload
          if [ -n "$OUTPUT_CSV" ] && [ -f "$OUTPUT_CSV" ]; then
            cp "$OUTPUT_CSV" "output/result_${DOMAIN}_job${JOB_IDX}_r${ROUND}.csv"
          else
            HEADER="Ref Product URL,Ref Product ID,Ref Variant ID,Ref Category,Ref Category URL,Product Type,Ref Brand Name,Collection Name,Ref Product Name,Ref SKU,Ref MPN,Ref GTIN,Ref Price,Ref Main Image,Ref Quantity,Ref Group Attr 1,Ref Group Attr 2,Ref Images,Ref Dimensions,Ref Status,Ref Highlights,Row JSON,Date Scrapped"
            echo "$HEADER" > "output/result_${DOMAIN}_job${JOB_IDX}_r${ROUND}.csv"
          fi

          if [ -n "$REMAINING_CSV" ] && [ -f "$REMAINING_CSV" ] && [ "$(wc -l < "$REMAINING_CSV")" -gt 1 ]; then
            cp "$REMAINING_CSV" "output/remaining_job${JOB_IDX}_r${ROUND}.csv"
          else
            echo "url,status,error_type,error_message,failed_at,job_id,chunk_id" > "output/remaining_job${JOB_IDX}_r${ROUND}.csv"
          fi

          if [ -n "$UNSCRAPED_CSV" ] && [ -f "$UNSCRAPED_CSV" ] && [ "$(wc -l < "$UNSCRAPED_CSV")" -gt 1 ]; then
            cp "$UNSCRAPED_CSV" "output/unscraped_job${JOB_IDX}_r${ROUND}.csv"
          else
            echo "url,reason,status,error_type,error_message,failed_at,job_id,chunk_id" > "output/unscraped_job${JOB_IDX}_r${ROUND}.csv"
          fi

      - name: Upload scraped output artifact
        uses: actions/upload-artifact@v4
        with:
          name: result_job${{ matrix.job_index }}_r${{ env.CURRENT_ROUND }}
          path: output/result_${{ matrix.domain }}_job${{ matrix.job_index }}_r${{ env.CURRENT_ROUND }}.csv
          retention-days: 3

      - name: Upload remaining URLs artifact
        uses: actions/upload-artifact@v4
        with:
          name: remaining_job${{ matrix.job_index }}_r${{ env.CURRENT_ROUND }}
          path: output/remaining_job${{ matrix.job_index }}_r${{ env.CURRENT_ROUND }}.csv
          retention-days: 3

      - name: Upload unscraped URLs artifact
        uses: actions/upload-artifact@v4
        with:
          name: unscraped_job${{ matrix.job_index }}_r${{ env.CURRENT_ROUND }}
          path: output/unscraped_job${{ matrix.job_index }}_r${{ env.CURRENT_ROUND }}.csv
          retention-days: 3

  # ── MERGE ─────────────────────────────────────────────────────────────────
  merge:
    needs: [plan, scrape]
    if: always() && needs.plan.outputs.mode != 'empty'
    runs-on: ubuntu-latest
    outputs:
      filename:          ${{ steps.meta.outputs.name }}
      has_remaining:     ${{ steps.check_remaining.outputs.has_remaining }}
      remaining_count:   ${{ steps.check_remaining.outputs.remaining_count }}

    steps:
      - name: Download result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: result_job*_r${{ env.CURRENT_ROUND }}
          path: chunks/results
          merge-multiple: true

      - name: Download remaining artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: remaining_job*_r${{ env.CURRENT_ROUND }}
          path: chunks/remaining
          merge-multiple: true

      - name: Download unscraped artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: unscraped_job*_r${{ env.CURRENT_ROUND }}
          path: chunks/unscraped
          merge-multiple: true

      - name: Merge scraped outputs
        run: |
          CSV_FILES=$(find chunks/results -name "*.csv" -type f 2>/dev/null || true)
          if [ -z "$CSV_FILES" ]; then
            echo "Ref Product URL,Ref Product ID,Ref Variant ID,Ref Category,Ref Category URL,Product Type,Ref Brand Name,Collection Name,Ref Product Name,Ref SKU,Ref MPN,Ref GTIN,Ref Price,Ref Main Image,Ref Quantity,Ref Group Attr 1,Ref Group Attr 2,Ref Images,Ref Dimensions,Ref Status,Ref Highlights,Row JSON,Date Scrapped" > products_full.csv
          else
            FIRST=$(echo "$CSV_FILES" | head -n 1)
            head -n 1 "$FIRST" > products_full.csv
            for f in $CSV_FILES; do
              if [ -s "$f" ] && [ "$(wc -l < "$f")" -gt 1 ]; then
                tail -n +2 "$f" | grep -v '^$' >> products_full.csv
              fi
            done
          fi

      - name: Merge remaining URLs
        id: check_remaining
        run: |
          REM_FILES=$(find chunks/remaining -name "*.csv" -type f 2>/dev/null || true)
          TOTAL_REMAINING=0
          if [ -z "$REM_FILES" ]; then
            echo "url,status,error_type,error_message,failed_at,job_id,chunk_id" > remaining_merged.csv
          else
            FIRST=$(echo "$REM_FILES" | head -n 1)
            head -n 1 "$FIRST" > remaining_merged.csv
            for f in $REM_FILES; do
              if [ -s "$f" ] && [ "$(wc -l < "$f")" -gt 1 ]; then
                ROWS=$(tail -n +2 "$f" | grep -v '^$' | wc -l)
                TOTAL_REMAINING=$((TOTAL_REMAINING + ROWS))
                tail -n +2 "$f" | grep -v '^$' >> remaining_merged.csv
              fi
            done
          fi
          
          if [ "$TOTAL_REMAINING" -gt 0 ]; then
            echo "has_remaining=true" >> $GITHUB_OUTPUT
          else
            echo "has_remaining=false" >> $GITHUB_OUTPUT
          fi
          echo "remaining_count=$TOTAL_REMAINING" >> $GITHUB_OUTPUT

      - name: Merge unscraped URLs
        run: |
          UNS_FILES=$(find chunks/unscraped -name "*.csv" -type f 2>/dev/null || true)
          if [ -z "$UNS_FILES" ]; then
            echo "url,reason,status,error_type,error_message,failed_at,job_id,chunk_id" > unscraped_merged.csv
          else
            FIRST=$(echo "$UNS_FILES" | head -n 1)
            head -n 1 "$FIRST" > unscraped_merged.csv
            for f in $UNS_FILES; do
              if [ -s "$f" ] && [ "$(wc -l < "$f")" -gt 1 ]; then
                tail -n +2 "$f" | grep -v '^$' >> unscraped_merged.csv
              fi
            done
          fi

      - name: Build output filename
        id: meta
        run: |
          CLEAN=$(echo "${{ env.WEBSITE_URL }}" | sed -E 's|https?://||' | sed 's|/.*||' | sed 's/\./_/g')
          DATE=$(date +%F)
          ROUND="${{ env.CURRENT_ROUND }}"
          FILENAME="${CLEAN}_file_r${ROUND}_${DATE}.csv"
          echo "name=$FILENAME" >> $GITHUB_OUTPUT

      - name: Upload final product CSV
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: products_full.csv
          retention-days: 7

      - name: Upload merged remaining CSV
        if: steps.check_remaining.outputs.has_remaining == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: remaining_merged
          path: remaining_merged.csv
          retention-days: 2

      - name: Upload merged unscraped CSV
        uses: actions/upload-artifact@v4
        with:
          name: unscraped_merged
          path: unscraped_merged.csv
          retention-days: 7

      - name: Organize local FTP directory structure & generate URL tracking
        id: ftp_prep
        run: |
          DATE=$(date +%Y%m%d)
          TS=$(date +%Y%m%d%H%M)
          
          # Initialize directory tree via ftp_manager.py
          python3 ftp_manager.py init-dirs -c Coleman -b output -d "$DATE"
          
          # Copy files into standardized paths
          COMP_DIR="output/Coleman/$DATE"
          mkdir -p "$COMP_DIR/input" "$COMP_DIR/output/temp" "$COMP_DIR/output"
          
          if [ -f "remaining_input/remaining_merged.csv" ]; then
            cp remaining_input/remaining_merged.csv "$COMP_DIR/input/URLList${TS}.csv"
            cp remaining_input/remaining_merged.csv "$COMP_DIR/output/temp/URLListForScrap${TS}.csv"
          fi
          
          if [ -f "products_full.csv" ]; then
            cp products_full.csv "$COMP_DIR/output/temp/ScrappedData${TS}.csv"
            cp products_full.csv "$COMP_DIR/output/FinalScrappedData${TS}.csv"
          fi
          
          # Generate FinalURLListForScrap tracking CSV
          if [ -f "remaining_input/remaining_merged.csv" ] && [ -f "products_full.csv" ]; then
            python3 ftp_manager.py track-urls \
              -s "remaining_input/remaining_merged.csv" \
              -d "products_full.csv" \
              -o "$COMP_DIR/output/FinalURLListForScrap${TS}.csv" || true
          fi

      - name: Upload to FTP server
        if: success()
        env:
          FTP_HOST:     ${{ env.FTP_HOST }}
          FTP_USER:     ${{ env.FTP_USER }}
          FTP_PASS:     ${{ env.FTP_PASS }}
          FTP_BASE_DIR: ${{ env.FTP_PATH }}
        run: |
          if [ -z "$FTP_HOST" ]; then exit 0; fi
          python3 ftp_manager.py upload -c Coleman -b output

      - name: Round summary
        run: |
          ROUND="${{ env.CURRENT_ROUND }}"
          MAX="${{ env.MAX_ROUNDS }}"
          REMAINING="${{ steps.check_remaining.outputs.remaining_count }}"
          HAS="${{ steps.check_remaining.outputs.has_remaining }}"
          echo "══════════════════════════════════════════"
          echo "  Round $ROUND / $MAX complete"
          echo "  Remaining URLs: $REMAINING"
          if [ "$HAS" = "true" ] && [ "$ROUND" -lt "$MAX" ]; then
            echo "  ➡  Will trigger round $(( ROUND + 1 ))"
          elif [ "$HAS" = "true" ]; then
            echo "  ⚠  Max rounds reached — $REMAINING URLs still failing"
          else
            echo "  ✅ All URLs resolved!"
          fi
          echo "══════════════════════════════════════════"

  # ── RE-TRIGGER (next round) ───────────────────────────────────────────────
  trigger_next_round:
    needs: [merge]
    if: |
      needs.merge.outputs.has_remaining == 'true' &&
      fromJson(github.event.inputs.current_round) < fromJson(github.event.inputs.max_rounds)
    runs-on: ubuntu-latest
    steps:
      - name: Calculate next round
        id: next
        run: echo "round=$(( ${{ env.CURRENT_ROUND }} + 1 ))" >> $GITHUB_OUTPUT

      - name: Trigger next round via workflow_dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT_ROUND="${{ steps.next.outputs.round }}"
          CURRENT_RUN_ID="${{ github.run_id }}"
          gh workflow run coleman-furniture.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            --field source_type="${{ env.SOURCE_TYPE }}" \
            --field ftp_filename="${{ env.FTP_FILENAME }}" \
            --field base_api="${{ env.BASE_API }}" \
            --field start_page="${{ env.START_PAGE }}" \
            --field end_page="${{ env.END_PAGE }}" \
            --field sitemap_url="${{ env.SITEMAP_URL }}" \
            --field direct_urls="${{ env.DIRECT_URLS }}" \
            --field urls_per_job="${{ env.URLS_PER_JOB }}" \
            --field max_workers="${{ env.MAX_WORKERS }}" \
            --field max_rounds="${{ env.MAX_ROUNDS }}" \
            --field current_round="$NEXT_ROUND" \
            --field remaining_run_id="$CURRENT_RUN_ID"
